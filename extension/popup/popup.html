<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dezombify</title>
  <link rel="stylesheet" href="../popup/popup.css">
</head>
<body data-mode="popup">
  <header>
    <img src="../icons/icon-48.png" alt="" width="30" height="30">
    <div><h1 data-i18n="extName"></h1><p data-i18n="tagline"></p></div>
  </header>
  <div class="ask" id="reviewBox" hidden>
    <p><b data-i18n="reviewTitle"></b> <span data-i18n="reviewText"></span></p>
    <div class="ask-actions">
      <a class="btn primary" id="reviewGo" target="_blank" rel="noopener" data-i18n="reviewButton"></a>
      <button type="button" class="btn" id="reviewLater" data-i18n="remindNextYear"></button>
      <button type="button" class="btn link" id="reviewNever" data-i18n="reviewNever" hidden></button>
    </div>
  </div>
  <label class="row master"><span data-i18n="masterOn"></span><input type="checkbox" data-key="enabled"></label>
  <label class="row sub demo"><span><span data-i18n="demo"></span><small data-i18n="demo_hint"></small></span><input type="checkbox" data-key="demo"></label>
  <div id="options"></div>
  <p class="links"><a href="#" id="openOptions" data-i18n="moreOptions"></a><a href="#" id="openStats" target="_blank" data-i18n="statsLink"></a><a id="moreLink" target="_blank" rel="noopener" data-i18n="moreLink"></a></p>
  <p class="note" data-i18n="note"></p>
  <script src="../popup/popup.js"></script>
</body>
</html>
